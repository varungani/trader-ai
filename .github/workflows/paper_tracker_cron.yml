name: 5-Min Automated Paper Tracker

on:
  schedule:
    # Runs every 5 minutes between 03:30 UTC (9:00 AM IST) and 10:00 UTC (3:30 PM IST), Monday to Friday
    - cron: '*/5 3-10 * * 1-5'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions

permissions:
  contents: write

jobs:
  audit-paper-trades:
    name: Audit Live Paper Trades
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Telegram Connection on Manual Dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from bot.telegram_notifier import default_telegram_notifier; default_telegram_notifier.send_message('☁️ *[GITHUB CLOUD CONNECTED]*\n━━━━━━━━━━━━━━━━━━━\n✅ GitHub Actions secrets verified successfully!\n⚡ Automated audits every 5 minutes during NSE market hours (09:15–15:30 IST) are armed.\n━━━━━━━━━━━━━━━━━━━\n_You will receive instant actionable trade instructions directly from this cloud runner._')"

      - name: Run 5-Min Live Audit
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/auto_paper_runner.py

      - name: Commit and Push Updated Tracker Data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [TraderAI]"
          git add data/dual_tracker.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(paper): auto-audit 30-min live paper trades [skip ci]"
            git push origin master
            git push origin master:production
          fi

