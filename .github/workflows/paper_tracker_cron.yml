name: 30-Min Backup Paper Tracker

on:
  schedule:
    # Lightweight 30-min fallback inside NSE window (09:30-15:30 IST, Mon-Fri)
    # Reduces GitHub Actions cron queue congestion while Hawk polls every 20s
    - cron: "30 3 * * 1-5"
    - cron: "0,30 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions

# Cancel stale queued cron runs instead of piling up a backlog that fires hours after close
concurrency:
  group: paper-tracker-cron
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit-paper-trades:
    name: Audit Live Paper Trades
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Pre-flight NSE Window Gate (Fast Exit Before Checkout/Pip)
        id: gate
        shell: bash
        run: |
          IST_HHMM=$(TZ='Asia/Kolkata' date +%H%M)
          IST_DOW=$(TZ='Asia/Kolkata' date +%u)
          echo "Current IST time: $IST_HHMM (Day $IST_DOW)"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ "$IST_DOW" -gt 5 ] || [ "$((10#$IST_HHMM))" -lt 915 ] || [ "$((10#$IST_HHMM))" -gt 1545 ]; then
              echo "Outside NSE live window (09:15-15:45 IST). Skipping run."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install --no-cache-dir -r requirements.txt

      - name: Verify Telegram Connection on Manual Dispatch
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "from bot.telegram_notifier import default_telegram_notifier; default_telegram_notifier.send_message('☁️ *[GITHUB CLOUD CONNECTED]*\n━━━━━━━━━━━━━━━━━━━\n✅ GitHub Actions secrets verified successfully!\n⚡ Automated audits every 5 minutes during NSE market hours (09:15–15:30 IST) are armed.\n━━━━━━━━━━━━━━━━━━━\n_You will receive instant actionable trade instructions directly from this cloud runner._')"

      - name: Run 5-Min Live Audit
        if: steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python engine/auto_paper_runner.py --market-hours-only

      - name: Commit and Push Updated Tracker Data
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [TraderAI]"
          git add data/*.json data/analytics/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(paper): auto-audit 9-way live paper tournament [skip ci]"
            git fetch origin master --depth=20 || true
            git pull --rebase origin master || true
            git push origin master || true
            git push origin master:production || true
          fi
