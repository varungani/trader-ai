name: CI & Gated Production Deployment

on:
  push:
    branches: [ develop, master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: 🧪 Run Test Suite & Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Syntax & Import Verification
        run: |
          python -m py_compile app.py config.py
          python -c "import app; print('app.py imported cleanly.')"
          python -c "import config; print('config.py loaded cleanly.')"

      - name: Run Pytest Suite
        run: |
          pytest tests/ -v --tb=short

  deploy-to-master:
    name: 🚀 Gated Deploy to Master (When Pushing to Develop)
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-Forward Sync to Master Branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [CI/CD Gated Deploy]"
          
          echo "CI tests passed on 'develop'! Syncing to 'master' branch..."
          git fetch origin master
          git checkout master
          git merge --ff-only develop || git merge develop -m "chore: gated CI deploy from develop [skip ci]"
          git push origin master
          echo "Master branch updated! Streamlit Cloud will now deploy cleanly."


  deploy-to-production:
    name: 🚀 Sync to Production Branch
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fast-Forward Sync to Production Branch
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [CI/CD Gated Deploy]"
          
          echo "CI tests passed! Updating 'production' branch..."
          git checkout -B production
          git merge --ff-only ${{ github.ref_name }}
          git push -f origin production
