name: Market Session Continuous Hawk Runner

on:
  schedule:
    # Boots at 03:40 UTC (09:10 AM IST) Mon-Fri, 5 mins before market open
    - cron: '40 3 * * 1-5'
  workflow_dispatch:
    inputs:
      fast_interval:
        description: 'Fast position polling interval in seconds'
        required: false
        default: '20'
      max_cycles:
        description: 'Max cycles to run (leave empty for full session)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  market-session-hawk:
    name: Continuous Hawk Surveillance (20s Polling)
    runs-on: ubuntu-latest
    timeout-minutes: 380 # Covers 09:10 to 15:35 IST (6 hrs 25 mins)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Hawk Surveillance
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAST_SEC="${{ github.event.inputs.fast_interval || '20' }}"
          MAX_C="${{ github.event.inputs.max_cycles }}"
          if [ -n "$MAX_C" ]; then
            python engine/auto_paper_runner.py --hawk --session-mode --fast-interval "$FAST_SEC" --max-cycles "$MAX_C"
          else
            python engine/auto_paper_runner.py --hawk --session-mode --fast-interval "$FAST_SEC"
          fi

      - name: Commit and Push Updated Tracker Data
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [TraderAI]"
          git add data/dual_tracker.json
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(hawk): market session live tracker sync [skip ci]" || true
            git pull --rebase origin master || true
            git push origin master || true
            git push origin master:production || true
          fi
