name: Market Session Continuous Hawk Runner

on:
  schedule:
    # Relay 1 (Morning Hawk Session): 09:10 AM IST (03:40 UTC) to 12:30 PM IST (3h 20m)
    - cron: '40 3 * * 1-5'
    # Relay 2 (Afternoon Hawk Session): 12:30 PM IST (07:00 UTC) to 03:35 PM IST (3h 05m)
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      fast_interval:
        description: 'Fast position polling interval in seconds'
        required: false
        default: '20'
      session_target:
        description: 'Relay target time (auto, 12:30, or 15:30)'
        required: false
        default: 'auto'
      max_cycles:
        description: 'Max cycles to run (leave empty for full session)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  market-session-hawk:
    name: Continuous Hawk Surveillance (20s Polling)
    runs-on: ubuntu-latest
    timeout-minutes: 240 # 4 Hours (Safely below GitHub's 360-min hard platform ceiling)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Continuous Hawk Surveillance
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAST_SEC="${{ github.event.inputs.fast_interval || '20' }}"
          TARGET="${{ github.event.inputs.session_target || 'auto' }}"
          MAX_C="${{ github.event.inputs.max_cycles }}"
          if [ -n "$MAX_C" ]; then
            python engine/auto_paper_runner.py --hawk --session-mode --session-target "$TARGET" --fast-interval "$FAST_SEC" --max-cycles "$MAX_C"
          else
            python engine/auto_paper_runner.py --hawk --session-mode --session-target "$TARGET" --fast-interval "$FAST_SEC"
          fi

      - name: Commit and Push Updated Tracker Data
        if: always()
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [TraderAI]"
          git add data/*.json data/analytics/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(hawk): market session 9-way live tracker sync [skip ci]" || true
            git pull --rebase origin master || true
            git push origin master || true
            git push origin master:production || true
          fi
