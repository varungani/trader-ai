name: Market Session Continuous Hawk Runner

on:
  schedule:
    # Relay 1 (Morning Hawk Session): 09:10 AM IST (03:40 UTC) to 12:30 PM IST
    - cron: '40 3 * * 1-5'
    # Relay 2 (Afternoon Hawk Session): 12:30 PM IST (07:00 UTC) to 03:35 PM IST
    - cron: '0 7 * * 1-5'
  workflow_dispatch:
    inputs:
      fast_interval:
        description: 'Fast position polling interval in seconds'
        required: false
        default: '20'
      session_target:
        description: 'Relay target time (auto, 12:30, or 15:30)'
        required: false
        default: 'auto'
      max_cycles:
        description: 'Max cycles to run (leave empty for full session)'
        required: false
        default: ''

# Cancel stuck earlier relay if delayed past handoff window
concurrency:
  group: market-session-hawk
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  market-session-hawk:
    name: Continuous Hawk Surveillance (20s Polling)
    runs-on: ubuntu-latest
    timeout-minutes: 215 # 3h 35m hard ceiling per relay

    steps:
      - name: Pre-flight NSE Window Gate (Prevent Delayed 7 PM Runs)
        id: gate
        shell: bash
        run: |
          IST_HHMM=$(TZ='Asia/Kolkata' date +%H%M)
          IST_DOW=$(TZ='Asia/Kolkata' date +%u)
          echo "Current IST time: $IST_HHMM (Day $IST_DOW)"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            if [ "$IST_DOW" -gt 5 ] || [ "$((10#$IST_HHMM))" -lt 905 ] || [ "$((10#$IST_HHMM))" -gt 1545 ]; then
              echo "Delayed or outside NSE window (09:05-15:45 IST). Aborting Hawk before startup."
              echo "should_run=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "should_run=true" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Dependencies
        if: steps.gate.outputs.should_run == 'true'
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run Continuous Hawk Surveillance
        if: steps.gate.outputs.should_run == 'true'
        env:
          TELEGRAM_ENABLED: ${{ secrets.TELEGRAM_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          FAST_SEC="${{ github.event.inputs.fast_interval || '20' }}"
          TARGET="${{ github.event.inputs.session_target || 'auto' }}"
          if [ "$TARGET" = "auto" ]; then
            IST_HHMM_NOW=$(TZ='Asia/Kolkata' date +%H%M)
            if [ "$((10#$IST_HHMM_NOW))" -lt 1230 ]; then
              TARGET="12:30"
            else
              TARGET="15:30"
            fi
          fi
          MAX_C="${{ github.event.inputs.max_cycles }}"
          if [ -n "$MAX_C" ]; then
            python engine/auto_paper_runner.py --hawk --session-mode --session-target "$TARGET" --fast-interval "$FAST_SEC" --max-cycles "$MAX_C"
          else
            python engine/auto_paper_runner.py --hawk --session-mode --session-target "$TARGET" --fast-interval "$FAST_SEC"
          fi

      - name: Commit and Push Updated Tracker Data
        if: always() && steps.gate.outputs.should_run == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [TraderAI]"
          git add data/*.json data/analytics/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(hawk): market session 9-way live tracker sync [skip ci]" || true
            git fetch origin master --depth=20 || true
            git pull --rebase origin master || true
            git push origin master || true
            git push origin master:production || true
          fi
